name: Gradle Build

on: [push]

jobs:
  build:

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v7

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SAIR_API_KEY: op://Infrastructure/sair-user-api-key/credential

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - name: Display host of runner
        run: echo $HOST_NAME
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Build with Gradle
        run: ./gradlew build
      - name: lint
        run: ./gradlew app:lint
      - name: lint results
        uses: yutailang0119/action-android-lint@v5.0.0
        with:
          report-path: app/build/reports/lint/report.xml
#      - name: checkstyle
#        run: ./gradlew checkStyleMain checkStyleTest
      - name: Jvm Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Install SAIR tools
        run: curl -fsSL https://raw.githubusercontent.com/compscidr/sair/v0.0.12/install.sh | bash

      # Capture output in a variable rather than piping, so a sair-acquire
      # failure fails this step instead of being masked by sed's exit code.
      - name: Acquire device lock
        run: |
          ACQUIRE_OUTPUT=$(sair-acquire --count 1)
          echo "$ACQUIRE_OUTPUT" | sed -n 's/^export //p' >> "$GITHUB_ENV"
          port=$(echo "$ACQUIRE_OUTPUT" | sed -n 's/^export ANDROID_ADB_SERVER_PORT=//p')
          # AGP 9.4+ runs instrumented tests in a process-isolated Gradle worker
          # whose environment is empty, so the adb it shells out to never sees
          # ANDROID_ADB_SERVER_PORT and lands on the bare proxy port. Point the
          # build at a shadow SDK whose adb has the scoped port baked in.
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$port" ] || [ ! -x "$sdk/platform-tools/adb" ]; then
            echo "::error::need a scoped ADB port ('$port') and an SDK with platform-tools/adb ('$sdk')"
            exit 1
          fi
          shim="$RUNNER_TEMP/sdk-shim"
          rm -rf "$shim" && mkdir -p "$shim/platform-tools"
          for f in "$sdk"/*; do [ "$(basename "$f")" = platform-tools ] || ln -s "$f" "$shim/"; done
          for f in "$sdk"/platform-tools/*; do [ "$(basename "$f")" = adb ] || ln -s "$f" "$shim/platform-tools/"; done
          printf '#!/bin/sh\nexec "%s/platform-tools/adb" -P %s "$@"\n' "$sdk" "$port" > "$shim/platform-tools/adb"
          chmod +x "$shim/platform-tools/adb"
          echo "ANDROID_HOME=$shim" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$shim" >> "$GITHUB_ENV"

      - name: Clean Packages
        run: bash ./scripts/clean-packages.sh

      - name: Uninstall stale APKs
        run: |
          adb devices | grep -w device | awk '{print $1}' | while read serial; do
            adb -s "$serial" uninstall com.example.myapplication 2>&1 | grep -v "DELETE_FAILED_INTERNAL_ERROR" || true
            adb -s "$serial" uninstall com.example.myapplication.test 2>&1 | grep -v "DELETE_FAILED_INTERNAL_ERROR" || true
          done

      - name: On-Device Instrumented Tests
        run:  ./gradlew connectedCheck

      - name: Release device lock
        if: always() && env.SAIR_LOCK_ID != ''
        run: sair-release

      - name: Generate Coverage Reports
        run: ./gradlew app:jacocoTestReport
      - uses: actions/upload-artifact@v7
        name: Store Reporting Artifacts
        if: failure()
        with:
          name: app-reports
          path: |
            app/build/reports
            app/build/outputs

      - name: Upload Unit Tests Report to CodeCov
        # https://github.com/codecov/codecov-action
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          files: ./app/build/reports/jacoco/jacocoTestReportDebug/jacocoTestReportDebug.xml

      - name: Upload Instrumented Tests Report to CodeCov
        # https://github.com/codecov/codecov-action
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: instrumentedtests
          files: ./app/build/reports/coverage/androidTest/debug/report.xml
